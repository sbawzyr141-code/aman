name: aman_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pdf: ^3.13.1
  printing: ^5.15.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  simple_icons: ^16.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Beiruti
      fonts:
        - asset: assets/fonts/Beiruti-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Beiruti-Light.ttf
          weight: 300
        - asset: assets/fonts/Beiruti-Regular.ttf
          weight: 400
        - asset: assets/fonts/Beiruti-Medium.ttf
          weight: 500
        - asset: assets/fonts/Beiruti-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Beiruti-Bold.ttf
          weight: 700
        - asset: assets/fonts/Beiruti-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Beiruti-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/playstore-icon.png"
  min_sdk_android: 21
